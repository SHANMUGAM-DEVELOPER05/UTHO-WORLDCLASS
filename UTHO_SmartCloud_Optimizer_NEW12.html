<title>UTHO – SmartCloud Optimizer</title>
<style>
:root{--bg:#070b1f;--card:rgba(20,28,66,.62);--tx:#e6ebff;--mu:#8e9ad0;--bd:rgba(110,140,255,.2);--ac:#3d7bff;--ac2:#18d4ff;--ok:#12a05c;--wn:#d98a00;--er:#d6334a;--sb:#12142b;--box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1fb;--card:rgba(255,255,255,.85);--tx:#1b1d33;--mu:#5d6288;--bd:#dde1f3;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(900px 500px at 80% -10%,rgba(61,123,255,.24),transparent),radial-gradient(700px 400px at 0 100%,rgba(130,80,255,.18),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
aside{width:236px;background:var(--sb);color:#c9cbe8;padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;overflow:auto}
aside h1{font-size:17px;color:#fff;margin:0 8px 2px}aside small{display:block;margin:0 8px 18px;color:#8b8fb8}
aside a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
aside a:hover{background:#1e2142}aside a.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;font-size:22px}h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.kpi b{display:block;font-size:26px;letter-spacing:-.5px}.kpi span{color:var(--mu);font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(61,123,255,.22);color:#9fc0ff}
.Healthy,.Running,.Low,.Active,.accepted,.Info{background:#dff5ea;color:#0b7a45}.Medium,.Underutilized,.Warning{background:#fff1d6;color:#9a6200}.High,.Idle,.Orphaned,.Critical,.rejected{background:#fde2e6;color:#b01f35}
.dark .x{}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--er)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12.5px}
tr.r{cursor:pointer}tr.r:hover{background:rgba(109,74,255,.07)}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row i{flex:1;height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.row i u{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.row em{font-style:normal;width:96px;font-size:13px}.row s{text-decoration:none;width:64px;text-align:right;font-weight:600}
.mu{color:var(--mu)}svg{max-width:100%;display:block}
.rec{border-left:4px solid var(--ac)}.rec p{margin:4px 0}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(8,9,24,.55);display:none;z-index:9;justify-content:flex-end}#ov.on{display:flex}
#dr{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:20px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--sb);color:#fff;padding:10px 16px;border-radius:10px;z-index:20}
.kpi{transition:transform .2s}.kpi:hover{transform:perspective(700px) rotateX(3deg) translateY(-2px)}@media(prefers-reduced-motion:reduce){.kpi:hover{transform:none}}.chat{max-height:380px;overflow:auto}.m{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(61,123,255,.14)}.m.u{background:rgba(24,212,255,.16);text-align:right}.chip{margin:0 6px 6px 0;font-size:12.5px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}a{color:var(--ac2)}.Stopped{background:rgba(150,160,190,.25);color:#b9c0dc}@keyframes pl{50%{opacity:.25}}.pulse{animation:pl 1.6s infinite}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}th[data-s]{cursor:pointer}textarea{width:100%;height:260px;font:12px monospace;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}
@media(max-width:800px){body{display:block}aside{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:10px}aside h1,aside small{display:none}aside a{white-space:nowrap}main{padding:16px}}
.stars{color:#ffb020;letter-spacing:2px;white-space:nowrap}.cmf input:not([type=checkbox]),.cmf select,.cmf textarea{width:100%}textarea.cmt{height:84px;font:inherit}.cmd{background:rgba(24,212,255,.1);border-left:3px solid var(--ac2);padding:6px 10px;border-radius:6px;margin:8px 0}.crf{width:auto!important;padding:0;margin-top:3px}.hm td,.hm th{text-align:center}

pages.comm=()=>`<div class="top"><h2>💬 Communication</h2><span class="badge">SAMPLE DATA</span></div><div class="card" style="margin-bottom:14px"><p style="margin:0">Connect with people who bought the same tools or services, read their reviews, share your own experience and pick a demo to try before you buy.</p><p class="mu" style="margin:6px 0 0">Sample members and reviews are made up and the products are fictional. What you post is saved only in this browser. Real people connecting across devices needs a server, which this offline file does not have.</p></div><div id="cmk" class="grid"></div><div class="bar">${[["reviews","⭐ Reviews & experiences"],["people","🤝 Connect with people"],["demos","🎬 Demo suggestions"]].map(t=>`<button class="${CM.tab==t[0]?"p":""}" onclick="CM.tab='${t[0]}';go()">${t[1]}</button>`).join("")}</div><div id="cmb"></div>`;
function cmKpi(){const L=CM.reviews,a=L.length?L.reduce((s,r)=>s+r.rate,0)/L.length:0;$("#cmk").innerHTML=kpi("Reviews",L.length,"shared so far")+kpi("Average rating",a.toFixed(1)+" / 5","all reviews")+kpi("Your connections",CM.conn.length,"people you follow")+kpi("Demos requested",CM.demos.filter(d=>d.req).length,"on your list")}
const cmFld=(l,h)=>`<div><label>${l}</label>${h}</div>`;
function cmDraw(){cmKpi();const b=$("#cmb"),T=CM.tab;
if(T=="reviews"){const cats=["Cloud service","Monitoring tool","Hardware","Course","Other"];
b.innerHTML=`<div class="card cmf" style="margin-bottom:14px"><h3>✍️ Share your experience</h3><div class="grid" style="margin:0">${cmFld("Your name",`<input id="cn" maxlength="40" value="${escH(CM.me)}" placeholder="e.g. Anita">`)}${cmFld("What did you buy?",`<input id="cp" maxlength="80" placeholder="Product or service">`)}${cmFld("Category",`<select id="cc">${cats.map(c=>`<option>${c}</option>`).join("")}</select>`)}${cmFld("Rating",`<select id="cr">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join("")}</select>`)}</div><label>Your experience</label><textarea id="ce" class="cmt" maxlength="600" placeholder="What worked, what did not, how long you used it"></textarea><label>Demo suggestion for future buyers (optional)</label><input id="cd" maxlength="160" placeholder="What should someone try first before paying?"><div class="acts"><button class="p" onclick="cmPost()">Post review</button></div></div><div class="bar"><input id="cq" value="${escH(CM.q)}" placeholder="Search reviews" aria-label="Search reviews"><select id="cf" aria-label="Category"><option value="">All categories</option>${cats.map(c=>`<option ${c==CM.cat?"selected":""}>${c}</option>`).join("")}</select></div><div id="cml"></div>`;
$("#cq").oninput=e=>{CM.q=e.target.value;cmList()};$("#cf").onchange=e=>{CM.cat=e.target.value;cmList()};cmList()}
else if(T=="people"){b.innerHTML=`<div class="grid g2">${CM_PEOPLE.map(p=>{const c=CM.conn.includes(p.id);return`<div class="card"><b>${p.name}</b><br><span class="mu">${p.role} · ${p.city}</span><p>Bought: <b>${p.bought}</b></p><div class="acts"><button class="${c?"":"p"}" onclick="cmConn('${p.id}')">${c?"✓ Connected":"🤝 Connect"}</button><button onclick="cmMsg('${p.id}')" ${c?"":"disabled title='Connect first'"}>💬 Message</button></div></div>`}).join("")}</div>`}
else{b.innerHTML=`<div class="card cmf" style="margin-bottom:14px"><h3>💡 Suggest a demo</h3><div class="grid" style="margin:0">${cmFld("Demo title",`<input id="dt" maxlength="90">`)}${cmFld("Product",`<input id="dp" maxlength="60">`)}</div><label>Why is it worth trying?</label><input id="dw" maxlength="160"><div class="acts"><button class="p" onclick="cmSug()">Add suggestion</button></div></div><div id="cdl"></div>`;cmDemos()}}
function cmList(){const q=CM.q.toLowerCase(),L=CM.reviews.filter(r=>(!CM.cat||r.cat==CM.cat)&&(!q||(r.prod+r.txt+r.by).toLowerCase().includes(q))).sort((a,b)=>b.id-a.id);
$("#cml").innerHTML=L.length?L.map(r=>{const c=CM.conn.includes(r.pid);return`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${escH(r.prod)}</b><span class="stars" title="${r.rate} out of 5">${stars(r.rate)}</span></div><span class="mu">${escH(r.by)} · ${r.when} · ${escH(r.cat)}</span><p>${escH(r.txt)}</p>${r.demo?`<p class="cmd">🎬 <b>Try first:</b> ${escH(r.demo)}</p>`:""}<div class="acts"><button onclick="cmHelp(${r.id})" ${CM.voted.includes(r.id)?"disabled":""}>👍 Helpful (${r.help})</button>${r.pid?`<button onclick="cmConn('${r.pid}')">${c?"✓ Connected":"🤝 Connect with "+r.by.split(" ")[0]}</button>`:""}</div></div>`}).join(""):`<div class="card mu">No reviews match. Try another search or share the first experience.</div>`}
function cmPost(){const g=i=>$("#"+i).value.trim(),prod=g("cp"),txt=g("ce");if(!prod||txt.length<10){toast("Add the product and at least 10 characters of experience");return}
CM.me=g("cn")||"Guest";CM.reviews.push({id:CM.nid++,by:CM.me,prod,cat:g("cc"),rate:+$("#cr").value,when:"Just now",txt,demo:g("cd"),help:0});cmSave();toast("Review posted");cmDraw()}
function cmHelp(id){if(CM.voted.includes(id))return;CM.reviews.find(r=>r.id==id).help++;CM.voted.push(id);cmSave();cmList()}
function cmConn(id){const i=CM.conn.indexOf(id);i<0?CM.conn.push(id):CM.conn.splice(i,1);cmSave();toast(i<0?"Connected":"Connection removed");CM.tab=="reviews"?(cmKpi(),cmList()):cmDraw()}
function cmMsg(id){const p=CM_PEOPLE.find(x=>x.id==id),m=CM.msgs[id]||[];$("#dr").innerHTML=`<button onclick="$('#ov').classList.remove('on')">Close</button><h2 style="margin:12px 0 4px">💬 ${p.name}</h2><span class="mu">${p.role} · bought ${p.bought}</span><div class="card chat" style="margin-top:12px">${m.length?m.map(t=>`<div class="m u">${escH(t)}</div>`).join(""):`<p class="mu">No messages yet. Ask about setup time, support or value for money.</p>`}</div><div class="bar" style="margin-top:10px"><input id="mi" style="flex:1" maxlength="300" placeholder="Write a message"><button class="p" onclick="cmSend('${id}')">Send</button></div><p class="mu">Demo only: sample members are not real and do not reply. Messages stay in this browser.</p>`;$("#ov").classList.add("on");$("#mi").onkeydown=e=>{if(e.key=="Enter")cmSend(id)};$("#mi").focus()}
function cmSend(id){const t=$("#mi").value.trim();if(!t)return;(CM.msgs[id]=CM.msgs[id]||[]).push(t);cmSave();cmMsg(id)}
function cmDemos(){$("#cdl").innerHTML=CM.demos.map(d=>`<div class="card" style="margin-bottom:10px"><b>🎬 ${escH(d.t)}</b> ${d.by?`<span class="badge">by ${escH(d.by)}</span>`:""}<br><span class="mu">${escH(d.p)} · ⏱ ${d.m?d.m+" min":"any length"} · ${d.lv}</span><p>${escH(d.w)}</p><div class="acts"><button class="${d.req?"":"p"}" onclick="cmReq(${d.id})">${d.req?"✓ On your list":"🎬 Request this demo"}</button><button onclick="cmUp(${d.id})" ${CM.voted.includes("d"+d.id)?"disabled":""}>👍 Useful (${d.up})</button></div></div>`).join("");cmKpi()}
function cmReq(id){const d=CM.demos.find(x=>x.id==id);d.req=d.req?0:1;cmSave();cmDemos()}
function cmUp(id){if(CM.voted.includes("d"+id))return;CM.demos.find(x=>x.id==id).up++;CM.voted.push("d"+id);cmSave();cmDemos()}
function cmSug(){const g=i=>$("#"+i).value.trim();if(!g("dt")||!g("dw")){toast("Add a title and why it is worth trying");return}CM.demos.unshift({id:CM.nid++,t:g("dt"),p:g("dp")||"General",m:0,lv:"Community",w:g("dw"),by:CM.me||"You",req:0,up:0});cmSave();toast("Suggestion added");cmDraw()}
function cmInit(){cmDraw()}

/* Share market crash: simple transparent model, not a forecast */
const CR_I={"Nifty 50":[.12,.16],"Sensex":[.12,.16],"Nifty Bank":[.13,.22],"Nifty Smallcap 250":[.14,.25],"S&P 500":[.10,.16],"Nasdaq 100":[.13,.22]};
const CR_H=[["1 week",1/52],["1 month",1/12],["3 months",.25],["6 months",.5],["1 year",1],["3 years",3],["5 years",5]],CR_T=[[0,"Any loss"],[5,"Fall of 5% or more"],[10,"Fall of 10% or more (correction)"],[20,"Fall of 20% or more (bear market)"],[30,"Fall of 30% or more (severe crash)"]];
const CR_F=[["val","📈","Stretched valuations",.02,.01,"Prices have run far ahead of company earnings, so small bad news can cause a big fall."],["rate","🏦","Rising interest rates",.02,.015,"Deposits and bonds look better and company loans cost more, so money moves out of shares."],["fii","🌐","Heavy foreign investor selling",.02,.015,"Large outflows push prices down and weaken the rupee at the same time."],["war","⚔️","Geopolitical conflict",.03,.01,"War or trade disputes create sudden uncertainty and investors sell first."],["oil","🛢️","Oil price spike",.015,.01,"India imports most of its oil, so costlier crude raises inflation and squeezes margins."],["inf","🛒","High inflation",.015,.01,"People spend less, rates may rise and profits shrink."],["rec","🌍","Global recession fears",.03,.02,"Weak demand abroad hurts exports, IT and manufacturing earnings."],["earn","📉","Falling company earnings",.02,.02,"Share prices follow profits over time, so weak results reset expectations."],["lev","🎰","Excess borrowing and euphoria",.025,.01,"When many people trade on borrowed money, a small fall forces selling that pushes prices lower still."],["inr","💱","Weak rupee",.01,.005,"A falling rupee cuts returns for foreign investors and can trigger more selling."]];
const CR_HIST=[["1992","Harshad Mehta securities scam","Bank money was diverted into shares. When it came out, the Sensex roughly halved over the following months."],["2000–01","Dot-com bust","Global technology shares were priced far above earnings, then collapsed. The Sensex lost about half its value."],["2008","Global financial crisis","US housing loans failed, Lehman Brothers collapsed and foreign investors pulled money out. The Sensex fell about 60% from its January 2008 peak."],["2020","COVID-19 shock","Lockdowns stopped economies almost overnight. The Nifty fell roughly 35 to 40% in about five weeks, then recovered within months."],["2022","Inflation and rate hikes","Central banks raised rates sharply and the Ukraine war lifted oil prices. Indian indices fell roughly 15 to 18% from the late-2021 peak."]];
let CR={idx:"Nifty 50",h:4,t:2,amt:100000,fs:[]};
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))},Phi=x=>.5*(1+erf(x/Math.SQRT2));
const crPar=(fs,st)=>{let[m,s]=CR_I[CR.idx];CR_F.forEach(f=>{if(fs.includes(f[0])){s+=f[3];m-=f[4]}});return st?[m-.04,s*1.4]:[m,s]},crP=(p,T,x)=>Phi((Math.log(1-x/100)-(p[0]-p[1]*p[1]/2)*T)/(p[1]*Math.sqrt(T)))*100;
const pf=v=>v<.1?"<0.1%":v<10?v.toFixed(1)+"%":Math.round(v)+"%",inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),crV=(p,T,A)=>A*Math.exp((p[0]-p[1]*p[1]/2)*T-1.645*p[1]*Math.sqrt(T));
pages.crash=()=>`<div class="top"><h2>📉 Share market crash</h2><span class="badge">MODEL ESTIMATE</span></div><div class="card" style="margin-bottom:14px"><p style="margin:0">Pick a market, a time period and how big a fall worries you. The page estimates the chance of that loss and shows which causes push the risk up.</p><p class="mu" style="margin:6px 0 0">This is a simple educational model using rounded long-run return and volatility assumptions. It uses no live prices, it is not a prediction and it is not investment advice. Real crashes are more frequent than a bell-curve model shows, so the stress case is the safer number to plan around.</p></div>
<div class="grid g2"><div class="card cmf"><h3>Your scenario</h3><label>Market or index</label><select id="ci">${Object.keys(CR_I).map(k=>`<option value="${escH(k)}" ${k==CR.idx?"selected":""}>${escH(k)}</option>`).join("")}</select><label>Time period</label><select id="ch">${CR_H.map((h,i)=>`<option value="${i}" ${i==CR.h?"selected":""}>${h[0]}</option>`).join("")}</select><label>How big a fall?</label><select id="ct">${CR_T.map((h,i)=>`<option value="${i}" ${i==CR.t?"selected":""}>${h[1]}</option>`).join("")}</select><label>Amount invested (₹)</label><input id="ca" type="number" min="1000" step="1000" value="${CR.amt}"><h3 style="margin-top:16px">Risk signals today</h3><p class="mu" style="margin:0 0 4px">Tick what applies now. Each one raises the estimate.</p>${CR_F.map(f=>`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin:6px 0"><input type="checkbox" class="crf" value="${f[0]}" ${CR.fs.includes(f[0])?"checked":""}>${f[1]} ${f[2]}</label>`).join("")}</div><div id="cro"></div></div><div id="crx"></div>`;
function crDraw(){const T=CR_H[CR.h][1],x=CR_T[CR.t][0],b=crPar(CR.fs,0),s=crPar(CR.fs,1),p=crP(b,T,x),q=crP(s,T,x),A=CR.amt,one=v=>v<.1?"very unlikely in this model":"about 1 in "+Math.max(1,Math.round(100/v));
const vb=crV(b,T,A),vs=crV(s,T,A),ls=v=>Math.max(0,A-v),cs=CR_F.filter(f=>CR.fs.includes(f[0])).map(f=>[f,p-crP(crPar(CR.fs.filter(k=>k!=f[0]),0),T,x)]).sort((a,c)=>c[1]-a[1]),mx=Math.max(.1,...cs.map(c=>c[1]));
$("#cro").innerHTML=`<div class="card" style="margin-bottom:14px"><h3>Chance of a ${CR_T[CR.t][1].toLowerCase()} within ${CR_H[CR.h][0]}</h3><div style="display:flex;gap:26px;flex-wrap:wrap"><div><b style="font-size:40px">${pf(p)}</b><br><span class="mu">baseline model</span></div><div><b style="font-size:40px;color:var(--wn)">${pf(q)}</b><br><span class="mu">stress case</span></div></div><p>That is ${one(p)} on the baseline and ${one(q)} in the stress case.</p></div>
<div class="card" style="margin-bottom:14px"><h3>What it could mean for ${inr(A)}</h3>${x?`<p>If a ${x}% fall happens, you would lose at least <b>${inr(A*x/100)}</b>.</p>`:""}<p>A bad 1-in-20 outcome over ${CR_H[CR.h][0]}: baseline value <b>${inr(vb)}</b> (${ls(vb)?"loss of "+inr(ls(vb)):"no loss"}), stress case <b>${inr(vs)}</b> (${ls(vs)?"loss of "+inr(ls(vs)):"no loss"}).</p></div>
<div class="card"><h3>Causes pushing this estimate up</h3>${cs.length?cs.map(c=>`<div class="row"><em style="width:210px;white-space:normal">${c[0][1]} ${c[0][2]}</em><i><u style="width:${Math.max(3,c[1]/mx*100)}%"></u></i><s style="width:84px">+${c[1].toFixed(1)} pts</s></div>`).join("")+`<p class="mu">Points show how much each cause adds to the baseline chance.</p>`:`<p class="mu">No risk signals ticked, so this is the long-run baseline. Tick signals on the left to see their effect.</p>`}</div>`;
const hm=v=>`rgba(214,51,74,${(Math.min(v,60)/60*.5).toFixed(2)})`;
$("#crx").innerHTML=`<div class="card" style="margin:14px 0"><h3>Chance of loss by period (baseline, with stress case beneath)</h3><div class="tw"><table class="hm" style="min-width:640px"><tr><th>Period</th>${CR_T.map(t=>`<th>${t[1].replace(/ \(.*/,"")}</th>`).join("")}</tr>${CR_H.map(h=>`<tr><th>${h[0]}</th>${CR_T.map(t=>{const a=crP(b,h[1],t[0]),c=crP(s,h[1],t[0]);return`<td style="background:${hm(a)}"><b>${pf(a)}</b><br><span class="mu">${pf(c)}</span></td>`}).join("")}</tr>`).join("")}</table></div></div>
<div class="grid g2"><div class="card"><h3>Why markets crash</h3>${CR_F.map(f=>`<p style="margin:8px 0;${CR.fs.includes(f[0])?"font-weight:600":""}">${f[1]} <b>${f[2]}.</b> <span class="mu">${f[5]}</span></p>`).join("")}</div><div class="card"><h3>Past crashes in India (approximate)</h3>${CR_HIST.map(h=>`<p style="margin:8px 0"><b>${h[0]} · ${h[1]}.</b> <span class="mu">${h[2]}</span></p>`).join("")}<p class="mu">After each fall, markets recovered, but it took from a few months to a few years. Check official index data for exact figures.</p><h3 style="margin-top:14px">Ways people reduce the damage</h3><p class="mu" style="margin:0">Spread money across assets, keep an emergency fund, invest only money you will not need for five years, and add in regular instalments instead of one lump sum.</p></div></div>`}
function crRead(){CR.idx=$("#ci").value;CR.h=+$("#ch").value;CR.t=+$("#ct").value;CR.amt=Math.max(1000,+$("#ca").value||100000);CR.fs=[...document.querySelectorAll(".crf:checked")].map(e=>e.value);crDraw()}
function crInit(){["ci","ch","ct","ca"].forEach(i=>$("#"+i).oninput=crRead);document.querySelectorAll(".crf").forEach(e=>e.onchange=crRead);crDraw()}
